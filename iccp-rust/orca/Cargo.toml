[package]
name = "orca"
version = "0.1.0"
build = "build.rs"
edition = "2021"

[dependencies]
capnp = "0.19.6"
capnp-rpc = "0.19.2"
capnpc = "0.19.0"
clap = "2.29"
futures = "0.3.30"
libc = "0.2"
lotus = { path = "../lotus" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "net", "macros", "time", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7.11", features = ["compat"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
capnpc = "0.19.0"
