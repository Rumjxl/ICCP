[package]
name = "lotus"
version = "0.1.0"
edition = "2021"
description = "High-performance concurrent congestion control algorithm framework"
license = "MIT"
repository = "https://github.com/your-org/lotus"
documentation = "https://docs.rs/lotus"
keywords = ["networking", "congestion-control", "async", "performance", "ccp"]
categories = ["network-programming", "asynchronous", "algorithms"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
portus = { path = "../portus" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
crossbeam = "0.8"
dashmap = "5.4"
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"
rayon = "1.7"
flume = "0.10"
uuid = { version = ">=1.0, <1.11", features = ["v4"] }
num_cpus = "1.0"
thiserror = "1.0"
rand = "0.8"
nix = "0.23"
libc = "0.2"
clap = ">=4, <4.5.21"
getrandom = ">=0.2, <0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "portus_migration"
path = "examples/portus_migration.rs"

[[example]]
name = "compute_intensive"
path = "examples/compute_intensive.rs"

[[bench]]
name = "algorithm_performance"
harness = false

[features]
default = []
# Enable additional debugging and profiling features
debug = ["tracing/max_level_trace"]
# Enable experimental features
experimental = []