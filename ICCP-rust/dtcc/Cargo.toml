[package]
name = "dtcc"
version = "0.1.0"
build = "build.rs"
edition = "2021"

[dependencies]
# capnp RPC for communicating with the RL agent
capnp = "0.19.6"
capnp-rpc = "0.19.2"
capnpc = "0.19.0"

# CLI
clap = "2.29"

# System bindings for monotonic clock
libc = "0.2"

# Async utilities
async-trait = "0.1"
futures = "0.3.30"

# Lotus framework replaces portus
lotus = { path = "../lotus" }

# Tokio async runtime
tokio = { version = "1", features = ["rt", "net", "macros", "time", "rt-multi-thread"] }
tokio-util = { version = "0.7.11", features = ["compat"] }

# Logging / tracing
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


[build-dependencies]
capnpc = "0.19.0"
