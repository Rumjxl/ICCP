[package]
name = "dtcc"
version = "0.1.0"
build = "build.rs"
edition = "2021"

[dependencies]
capnp = "0.19.6"
capnp-rpc = "0.19.2"
capnpc = "0.19.0"
clap = "2.29"
futures = "0.3.30"
libc = "0.2"
portus = { path = "../portus", features = [] }
slog = "2.7.0"
slog-async = "2.8.0"
slog-term = "2.9.1"
structopt = "0.3.26"
tokio = {version = "1", features = ["rt","net","macros","time","rt-multi-thread"]}
tokio-util = {version = "0.7.11", features = ["compat"]}
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"


[build-dependencies]
capnpc = "0.19.0"
